
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraGest - Design Épure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #FAF7F2;
            color: #2D241E;
            -webkit-font-smoothing: antialiased;
        }
        
        .bg-terracotta { background-color: #D27D56; }
        .text-terracotta { color: #D27D56; }
        .border-terracotta { border-color: #D27D56; }
        .bg-terracotta-light { background-color: #F4EBE2; }
        .bg-terracotta-soft { background-color: #FAF2EB; }
        
        .shadow-premium {
            box-shadow: 0 20px 50px -12px rgba(210, 125, 86, 0.1);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #FAF7F2; }
        ::-webkit-scrollbar-thumb { background: #D27D56; border-radius: 10px; }

        @media print {
            .no-print { display: none !important; }
        }
    </style>
